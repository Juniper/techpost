plugins:
- caption-per-book
- search:
    separator: '[\s\-\_]'
- minify:
    minify_html: true
site_author: HPE Networking Tech Post
site_name: Tech Post - Technical articles by HPE Networking
site_url: https://juniper.github.io/techpost/
theme:
  custom_dir: overrides
  favicon: images/favicon.ico
  features:
  - toc.follow
  - navigation.top
  - navigation.tabs
  # navigation.instant keeps the HPE HFWS header/footer persistent across page
  # changes (no flicker). js/hfws-instant-guard.js moves the HFWS stylesheets into
  # <body> so instant navigation's <head> reconciliation cannot strip them (which
  # otherwise left the HPE header/footer unstyled after navigating).
  - navigation.instant
  - navigation.indexes
  - search.suggest
  - search.highlight
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - content.action.edit
  - content.tooltips
  - content.footnote.tooltips
  font: false
  language: en
  name: material
  palette:
  - scheme: default
    primary: custom
    accent: custom

