copyright: This site is maintained by HPE/Juniper Networking employees. Powered by
  Material for MkDocs & Pandoc
docs_dir: docs
extra:
  generator: false
  social:
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hewlett-packard-enterprise
  - icon: fontawesome/brands/github
    link: https://github.com/juniper
  analytics:
    provider: google
    property: G-MC1QNS9JDM
extra_css:
- https://cdn.jsdelivr.net/npm/katex@0.15.2/dist/katex.min.css
- https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css
- stylesheets/extra.css
extra_javascript:
- https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js
- https://cdn.jsdelivr.net/npm/katex@0.15.2/dist/katex.min.js
- https://cdn.jsdelivr.net/npm/katex@0.15.2/dist/contrib/auto-render.min.js
- https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js
- js/math-render.js
- js/extra.js
markdown_extensions:
- attr_list
- pymdownx.extra
- markdown_katex
- toc:
    permalink: true
    toc_depth: 4
- pymdownx.highlight:
    anchor_linenums: true
    guess_lang: false
    linenums: true
nav:
- Home: index.md
- All Articles:
  - Select a Techpost: articles/menu/main.md
  - Platforms / Line Cards Deepdive:
    - MX Series:
      - MX301 Deepdive: articles/mx301-deepdive/article.md
      - MX301 High-Performance FlowSpec Without Compromise: articles/mx301-high-performance-flowspec-without-compromise/article.md
      - MX301 A Powerful Filtering Gateway: articles/mx301-a-powerful-filtering-gateway/article.md
- About us: about.md
plugins:
- caption-per-book
- search:
    separator: '[\s\-\_]'
- minify:
    minify_html: true
site_author: HPE Networking Techpost
site_name: TECHPOST - Technical articles by HPE Networking
theme:
  favicon: images/favicon.ico
  features:
  - toc.follow
  - navigation.top
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.instant
  - navigation.footer
  - navigation.indexes
  - search.suggest
  - search.highlight
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - content.action.edit
  - content.tooltips
  - content.footnote.tooltips
  font:
    code: Nova
    text: Google Sans
  language: en
  logo: images/hpen.png
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode

