copyright: This site is maintained by HPE/Juniper Networking employees. Powered by
  Material for MkDocs & Pandoc
docs_dir: docs
not_in_nav: |
  search-results.md
extra:
  generator: false
  social:
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hewlett-packard-enterprise
  - icon: fontawesome/brands/github
    link: https://github.com/juniper
  analytics:
    provider: google
    property: G-MC1QNS9JDM
extra_css:
- vendor/katex/katex.min.css
- vendor/glightbox/glightbox.min.css
- stylesheets/extra.css
extra_javascript:
- vendor/glightbox/glightbox.min.js
- vendor/katex/katex.min.js
- vendor/katex/contrib/auto-render.min.js
- vendor/fontawesome/all.min.js
- js/math-render.js
- js/extra.js
- js/hfws-instant-guard.js
- js/hfws-header-merge.js
- js/search-results.js
markdown_extensions:
- attr_list
- pymdownx.extra
- markdown_katex
- toc:
    permalink: true
    toc_depth: 4
- pymdownx.highlight:
    anchor_linenums: true
    guess_lang: false
    linenums: true
nav:
- Home: index.md
- All Articles:
  - Select a Techpost: articles/menu/main.md
  - Platforms / Line Cards Deepdive:
    - MX Series:
      - MX301 Deepdive: articles/mx301-deepdive/article.md
      - MX301 High-Performance FlowSpec Without Compromise: articles/mx301-high-performance-flowspec-without-compromise/article.md
      - MX301 A Powerful Filtering Gateway: articles/mx301-a-powerful-filtering-gateway/article.md
- About us: about.md
plugins:
- caption-per-book
- search:
    separator: '[\s\-\_]'
- minify:
    minify_html: true
site_author: HPE Networking Techpost
site_name: TECHPOST - Technical articles by HPE Networking
site_url: https://juniper.github.io/techpost/
theme:
  custom_dir: overrides
  favicon: images/favicon.ico
  features:
  - toc.follow
  - navigation.top
  - navigation.tabs
  # navigation.instant keeps the HPE HFWS header/footer persistent across page
  # changes (no flicker). js/hfws-instant-guard.js moves the HFWS stylesheets into
  # <body> so instant navigation's <head> reconciliation cannot strip them (which
  # otherwise left the HPE header/footer unstyled after navigating).
  - navigation.instant
  - navigation.indexes
  - search.suggest
  - search.highlight
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - content.action.edit
  - content.tooltips
  - content.footnote.tooltips
  font: false
  language: en
  name: material
  palette:
  - scheme: default
    primary: custom
    accent: custom

