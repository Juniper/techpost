name: Build and Deploy Techpost Site

on:
  push:
    branches:
      - '**'
    tags:
      - '*rebuild-all*'
  delete:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# Serialize gh-pages work so concurrent runs never reject each other's push and leave a branch's portal showing stale content.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  # Cheap gate: skip the heavy build for branch pushes that have no matching
  # docs/articles/<branch>/ folder (e.g. a branch freshly created from main).
  preflight:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - name: Decide whether a build is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ] || [ "$REF_NAME" = "main" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api --silent "repos/${GITHUB_REPOSITORY}/contents/docs/articles/${REF_NAME}?ref=${GITHUB_SHA}" 2>/dev/null; then
            echo "Found docs/articles/${REF_NAME}; building preview."
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No docs/articles/${REF_NAME} on this branch; skipping build."
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: preflight
    if: needs.preflight.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    # Prebuilt image with Python 3.12, Pandoc 3.5, TeX Live, poppler-utils and the
    # repo's Pandoc templates (see .github/docker/pandoc-ci and build-pandoc-image.yml).
    container:
      image: ghcr.io/juniper/techpost/pandoc-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        # Container jobs default to `sh`; the scripts below need bash (pipefail, arrays).
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required by the change-detection git diff in the convert step
          fetch-depth: 0

      # `${{ github.workspace }}` is the host path; inside the container the
      # workspace is mounted elsewhere, so resolve it from the runtime env.
      - name: Set download directory
        run: echo "MAIN_PDF_DIR=$GITHUB_WORKSPACE/site/download" >> "$GITHUB_ENV"

      # ----------------------------
      # Python / MkDocs (interpreter comes from the container image)
      # ----------------------------
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'setup.py') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install .

      # ----------------------------
      # Build MkDocs site (converted from GitLab `build_site` stage)
      # ----------------------------
      - name: Build MkDocs site
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          BRANCH="$BRANCH_NAME"
          echo "Branch detected: $BRANCH"
          if [ "$BRANCH" != "main" ]; then
            echo "Patching mkdocs.yml and preview base URL for branch $BRANCH"
            BRANCH="$BRANCH" python3 .github/scripts/patch_mkdocs.py
          fi

          echo "==== mkdocs.yml content before build ===="
          cat mkdocs.yml
          echo "========================================="

          cd docs/articles || exit 1
          for docs in */; do
              if [ "${docs%/}" = "menu" ]; then
                  echo "Skipping $docs"
                  continue
              fi

              echo "Processing $docs"
              cd "$docs" || continue

              # Check if any article.md files exist
              if ls article.md 1>/dev/null 2>&1; then
                echo "Cleaning up markdown references"
                python3 ../../../.github/scripts/clean_md_links.py article.md
                sed -i -e 's/<a\s*[^>]*id="\([^"]*\)"[^>]*>/\\label{\1}/g' -e 's/\xC2\xA0/ /g' article.md
                echo "sanitize md files to remove hidden unicode characters"
                python3 ../../../.github/scripts/sanitize_md.py article.md
                echo "add download buttons to md files"
                python3 ../../../.github/scripts/add_download_icons.py article.md "${docs%/}"
              fi

              cd ..
          done
          cd ../..

          echo "Building site"
          # Fail loudly: a silent build failure would flush ./site and, combined
          # with keep_files on deploy, leave the branch portal showing stale HTML.
          mkdocs build || { echo "::error::mkdocs build failed for branch ${BRANCH}"; exit 1; }

          echo "cleaning up the md file - removing line 4"
          cd docs/articles || exit 1
          for docs in */; do
              if [ "${docs%/}" = "menu" ]; then
                  echo "Skipping $docs"
                  continue
              fi

              echo "Processing $docs"
              cd "$docs" || continue

              # Check if any article*.md files exist
              if ls article*.md 1>/dev/null 2>&1; then
                echo "remove line 4 from md files"
                python3 ../../../.github/scripts/remove_line4.py article.md
              fi

              cd ..
          done
          cd ../..

      # ----------------------------
      # Restore already-published download assets from gh-pages so incremental
      # builds keep them and pdf-list.json stays complete (mkdocs build flushes ./site)
      # ----------------------------
      - name: Restore published downloads from gh-pages
        if: github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && contains(github.ref_name, 'rebuild-all'))
        run: |
          mkdir -p "$MAIN_PDF_DIR"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "Fetching gh-pages branch"
            git fetch --depth=1 origin gh-pages
            if git cat-file -e origin/gh-pages:download 2>/dev/null; then
              echo "Restoring previously published download assets into $MAIN_PDF_DIR"
              git archive origin/gh-pages download | tar -x -C "$MAIN_PDF_DIR" --strip-components=1
              echo "Restored $(find "$MAIN_PDF_DIR" -type f | wc -l) published files"
            else
              echo "No download/ folder on gh-pages yet; nothing to restore"
            fi
          else
            echo "gh-pages branch does not exist yet; nothing to restore"
          fi

      # ----------------------------
      # Convert articles to PDF / EPUB (converted from GitLab `convertion` stage)
      # Runs only on main, or on a tag / commit flagged with rebuild-all
      # ----------------------------
      - name: Convert articles to PDF/EPUB
        if: github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && contains(github.ref_name, 'rebuild-all'))
        env:
          COMMIT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          OUTPUT_FILE="$MAIN_PDF_DIR/pdf-list.json"
          echo "Saving PDFs to $MAIN_PDF_DIR"
          mkdir -p "$MAIN_PDF_DIR"

          # Check if full rebuild is requested via tag or commit message via rebuild-all
          REBUILD_ALL=false
          if [ "$IS_TAG" = "true" ] && echo "$REF_NAME" | grep -qi "rebuild-all"; then
            echo "Tag '$REF_NAME' detected — forcing full rebuild of all PDFs/EPUBs/PNGs"
            REBUILD_ALL=true
          elif echo "$COMMIT_MESSAGE" | grep -qi "rebuild-all"; then
            echo "Commit message contains 'rebuild-all' — forcing full rebuild of all PDFs/EPUBs/PNGs"
            REBUILD_ALL=true
          fi

          # Determine which article.md files were modified in this commit/merge
          if [ "$REBUILD_ALL" = "true" ]; then
            echo "Full rebuild requested. Processing all articles."
            CHANGED_FILES="all"
          else
            echo "Detecting modified article.md files..."
            if [ -n "$COMMIT_BEFORE" ] && [ "$COMMIT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only "$COMMIT_BEFORE" "$COMMIT_SHA" -- 'docs/articles/*/article*.md' || true)
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'docs/articles/*/article*.md' || true)
            fi

            if [ -z "$CHANGED_FILES" ]; then
              echo "No article.md files were modified. Skipping PDF/EPUB generation."
              # Rebuild pdf-list.json from existing PDFs in MAIN_PDF_DIR
              existing_pdfs=$(find "$MAIN_PDF_DIR" -maxdepth 1 -name '*.pdf' -printf '"%f",' 2>/dev/null | sed 's/,$//')
              echo "[${existing_pdfs}]" > "$OUTPUT_FILE"
              exit 0
            fi
          fi

          if [ "$REBUILD_ALL" != "true" ]; then
            echo "Modified article files:"
            echo "$CHANGED_FILES"

            # Extract unique directory names that have changes
            CHANGED_DIRS=$(echo "$CHANGED_FILES" | sed 's|docs/articles/\([^/]*\)/.*|\1|' | sort -u)
            echo "Directories to rebuild: $CHANGED_DIRS"
          fi

          cd docs/articles || exit 1
          docs_dirs=$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*')
          if [ -z "$docs_dirs" ]; then
              echo "No actual docs directories found in docs/articles. Skipping PDF build."
              echo "[]" > "$OUTPUT_FILE"
              exit 0
          fi

          # Collect existing PDFs for the final JSON list
          pdf_files=()
          for existing_pdf in "$MAIN_PDF_DIR"/*.pdf; do
            [ -f "$existing_pdf" ] && pdf_files+=("\"$(basename "$existing_pdf")\"")
          done

          for docs in */; do
              if [ "${docs%/}" = "menu" ]; then
                  echo "Skipping $docs"
                  continue
              fi

              # Only process directories with modified article.md files (unless full rebuild)
              if [ "$REBUILD_ALL" != "true" ] && ! echo "$CHANGED_DIRS" | grep -qx "${docs%/}"; then
                  echo "Skipping $docs (no changes detected)"
                  continue
              fi

              echo "Processing $docs (modified)"
              cd "$docs" || continue

              md_files=""
              # Check if any article*.md files exist
              if ls article*.md 1>/dev/null 2>&1; then
                  # Loop over files sorted numerically (article.md, article2.md, ...)
                  for article in $(ls article*.md | sort -V); do
                      md_files="$md_files $article"
                  done
              fi

              if [ -n "$md_files" ]; then
                  cat /dev/null > combined.md
                  for file in $md_files; do
                      sed '/^---$/,/^---$/d' "$file" >> combined.md
                      echo "" >> combined.md
                      echo "\pagebreak" >> combined.md
                  done

                  echo "Cleaning up markdown references"
                  python3 ../../../.github/scripts/clean_md_links.py combined.md
                  sed -i -e 's/<a\s*[^>]*id="\([^"]*\)"[^>]*>/\\label{\1}/g' -e 's/\xC2\xA0/ /g' combined.md

                  echo "sanitize md files to remove hidden unicode characters"
                  python3 ../../../.github/scripts/sanitize_md.py combined.md

                  echo "Setting lof/lot flags based on article content"
                  python3 ../../../.github/scripts/set_lof_lot.py combined.md pandoc-pdf.yml

                  pandoc -s --number-sections --listings --template "/usr/share/pandoc/data/templates/custom.latex" \
                         --metadata-file article-desc.yml --metadata-file pandoc-pdf.yml --output="${docs%/}.pdf" combined.md

                  if [ -f "${docs%/}.pdf" ]; then
                      echo "PDF generated successfully for $docs"
                      cp "${docs%/}.pdf" "$MAIN_PDF_DIR"
                      pdf_files+=("\"${docs%/}.pdf\"")

                      # Generate PNG icons for the PDF
                      echo "Generating icon for ${docs%/}.pdf"
                      output_png="$MAIN_PDF_DIR/${docs%/}"
                      pdftoppm -png -f 1 -l 1 -singlefile "${docs%/}.pdf" "$output_png"

                      if [ -f "$output_png.png" ]; then
                          echo "PDF image icon generated at $output_png.png"
                          echo "Cleaning up markdown for EPUB"
                          python3 ../../../.github/scripts/clean_for_epub.py combined.md combined-epub.md
                          echo "Generating numbering for sections, figures and tables for EPUB"
                          python3 ../../../.github/scripts/epub_numbering.py combined-epub.md
                          echo "Generating EPUB for ${docs%/}.epub"
                          pandoc -s --metadata-file=pandoc-epub.yml \
                                 --metadata-file article-desc.yml --epub-cover-image="$output_png.png" --output="${docs%/}.epub" combined-epub.md
                          if [ -f "${docs%/}.epub" ]; then
                              echo "EPUB generated successfully for $docs"
                              cp "${docs%/}.epub" "$MAIN_PDF_DIR"
                          else
                              echo "Failed to generate EPUB for $docs."
                          fi
                      else
                          echo "Failed to generate icon for ${docs%/}.pdf and therefore epub version"
                      fi
                  else
                      echo "PDF generation failed for $docs. See pandoc.log for details."
                  fi
              else
                  echo "No markdown files found for $docs. Skipping PDF generation."
              fi
              cd ..
          done

          # Write JSON list of PDFs (deduplicated)
          unique_pdfs=$(printf '%s\n' "${pdf_files[@]}" | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "[${unique_pdfs}]" > "$OUTPUT_FILE"
          echo "Generated $OUTPUT_FILE with updated PDF list."

      # ----------------------------
      # Branch preview: convert ONLY docs/articles/<branch>/ and stage only that
      # article, its PDF/EPUB, and the shared assets needed to render it.
      # ----------------------------
      - name: Check whether branch downloads need regeneration
        id: branch-pdf
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          REGENERATE=false

          if echo "$COMMIT_MESSAGE" | grep -qi "rebuild-all"; then
            echo "Commit message requests rebuild-all."
            REGENERATE=true
          else
            if [ -n "$COMMIT_BEFORE" ] && [ "$COMMIT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only "$COMMIT_BEFORE" "$COMMIT_SHA" -- "docs/articles/${BRANCH_NAME}/" || true)
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- "docs/articles/${BRANCH_NAME}/" || true)
            fi

            if [ -n "$CHANGED_FILES" ]; then
              echo "Article files changed; regenerating branch PDF and EPUB:"
              echo "$CHANGED_FILES"
              REGENERATE=true
            fi
          fi

          if [ "$REGENERATE" != "true" ]; then
            mkdir -p "$MAIN_PDF_DIR"
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch --depth=1 origin gh-pages
              for extension in pdf epub; do
                published_path="${BRANCH_NAME}/download/${BRANCH_NAME}.${extension}"
                if git cat-file -e "origin/gh-pages:${published_path}" 2>/dev/null; then
                  git show "origin/gh-pages:${published_path}" > "$MAIN_PDF_DIR/${BRANCH_NAME}.${extension}"
                fi
              done
            fi
            if [ ! -s "$MAIN_PDF_DIR/${BRANCH_NAME}.pdf" ] || [ ! -s "$MAIN_PDF_DIR/${BRANCH_NAME}.epub" ]; then
              echo "Existing branch downloads are missing; regenerating them."
              REGENERATE=true
            else
              echo "No article changes; reusing this branch's published PDF/EPUB."
            fi
          fi

          echo "regenerate=$REGENERATE" >> "$GITHUB_OUTPUT"

      - name: Convert branch article to PDF/EPUB (preview)
        if: github.ref_type == 'branch' && github.ref_name != 'main' && steps.branch-pdf.outputs.regenerate == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          ARTICLE_DIR="docs/articles/${BRANCH_NAME}"
          if [ ! -d "$ARTICLE_DIR" ]; then
            echo "No article folder '$ARTICLE_DIR' for branch '$BRANCH_NAME'. Skipping."
            exit 0
          fi

          mkdir -p "$MAIN_PDF_DIR"

          cd "$ARTICLE_DIR" || exit 1

          md_files=""
          if ls article*.md 1>/dev/null 2>&1; then
              for article in $(ls article*.md | sort -V); do
                  md_files="$md_files $article"
              done
          fi
          if [ -z "$md_files" ]; then
              echo "No article markdown found in $ARTICLE_DIR. Skipping."
              exit 0
          fi

          cat /dev/null > combined.md
          for file in $md_files; do
              sed '/^---$/,/^---$/d' "$file" >> combined.md
              echo "" >> combined.md
              echo "\pagebreak" >> combined.md
          done

          echo "Cleaning up markdown references"
          python3 ../../../.github/scripts/clean_md_links.py combined.md
          sed -i -e 's/<a\s*[^>]*id="\([^"]*\)"[^>]*>/\\label{\1}/g' -e 's/\xC2\xA0/ /g' combined.md
          echo "sanitize md files to remove hidden unicode characters"
          python3 ../../../.github/scripts/sanitize_md.py combined.md

          echo "Setting lof/lot flags based on article content"
          python3 ../../../.github/scripts/set_lof_lot.py combined.md pandoc-pdf.yml

          echo "Generating PDF for branch '$BRANCH_NAME'"
          pandoc -s --number-sections --listings --template "/usr/share/pandoc/data/templates/custom.latex" \
                 --metadata-file article-desc.yml --metadata-file pandoc-pdf.yml --output="${BRANCH_NAME}.pdf" combined.md

          test -s "${BRANCH_NAME}.pdf" || { echo "::error::PDF generation failed for branch '$BRANCH_NAME'."; exit 1; }
          cp "${BRANCH_NAME}.pdf" "$MAIN_PDF_DIR"

          output_png="$MAIN_PDF_DIR/${BRANCH_NAME}"
          pdftoppm -png -f 1 -l 1 -singlefile "${BRANCH_NAME}.pdf" "$output_png"
          test -s "$output_png.png" || { echo "::error::PDF cover image generation failed for '$BRANCH_NAME'."; exit 1; }
          echo "Generating EPUB for branch '$BRANCH_NAME'"
          python3 ../../../.github/scripts/clean_for_epub.py combined.md combined-epub.md
          python3 ../../../.github/scripts/epub_numbering.py combined-epub.md
          pandoc -s --metadata-file=pandoc-epub.yml \
                 --metadata-file article-desc.yml --epub-cover-image="$output_png.png" \
                 --output="${BRANCH_NAME}.epub" combined-epub.md
          test -s "${BRANCH_NAME}.epub" || { echo "::error::EPUB generation failed for branch '$BRANCH_NAME'."; exit 1; }
          cp "${BRANCH_NAME}.epub" "$MAIN_PDF_DIR"

          cd "$GITHUB_WORKSPACE" || exit 1
          echo "Branch PDF/EPUB ready in $MAIN_PDF_DIR."

      - name: Prepare minimal branch preview
        id: branch-preview
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/prepare_branch_preview.py

      - name: Checkout GitHub Pages for branch preview
        if: github.ref_type == 'branch' && github.ref_name != 'main' && steps.branch-preview.outputs.has_article == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-preview
          fetch-depth: 1

      - name: Replace only this branch preview
        if: github.ref_type == 'branch' && github.ref_name != 'main' && steps.branch-preview.outputs.has_article == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_branch_preview.py \
            --branch "$BRANCH_NAME" \
            --preview-dir branch-preview \
            --pages-dir gh-pages-preview
          git -C gh-pages-preview config user.name "github-actions"
          git -C gh-pages-preview config user.email "github-actions@github.com"
          git -C gh-pages-preview add -A -- "$BRANCH_NAME"
          if git -C gh-pages-preview diff --cached --quiet -- "$BRANCH_NAME"; then
            echo "Branch preview is already up to date."
            exit 0
          fi
          git -C gh-pages-preview commit -m "Deploy preview for branch $BRANCH_NAME"
          git -C gh-pages-preview push origin gh-pages

      - name: Deploy main site to GitHub Pages
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true

      - name: Deploy tag build to its Pages directory
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          destination_dir: ${{ github.ref_name }}

  # ==========================================================
  # CLEANUP JOB — remove ONLY the deleted branch's preview.
  # The main site is published at the gh-pages root, so a blind sweep would
  # delete main's own folders (articles, js, ...). We therefore delete just the
  # subfolder named after the deleted branch.
  # ==========================================================
  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Remove the deleted branch's preview
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          cd gh-pages

          # Never touch the main site (published at the gh-pages root).
          if [ -z "${DELETED_BRANCH}" ] || [ "${DELETED_BRANCH}" = "main" ]; then
            echo "Refusing to remove '${DELETED_BRANCH}'."
            exit 0
          fi
          if [ ! -d "${DELETED_BRANCH}" ]; then
            echo "No preview directory for branch '${DELETED_BRANCH}'; nothing to do."
            exit 0
          fi

          echo "Removing preview for deleted branch: ${DELETED_BRANCH}"
          rm -rf -- "${DELETED_BRANCH}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Cleanup preview for deleted branch ${DELETED_BRANCH}" || echo "Nothing to clean"
          git push