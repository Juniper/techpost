name: Build Pandoc CI image

# Rebuilds ghcr.io/juniper/techpost/pandoc-ci whenever the image definition or
# the Pandoc templates baked into it change. deploy.yml runs inside this image.
on:
  push:
    branches:
      - main
    paths:
      - '.github/docker/pandoc-ci/**'
      - '.github/workflows/build-pandoc-image.yml'
      - 'templates/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/pandoc-ci/Dockerfile
          push: true
          tags: |
            ghcr.io/juniper/techpost/pandoc-ci:latest
            ghcr.io/juniper/techpost/pandoc-ci:${{ github.sha }}
